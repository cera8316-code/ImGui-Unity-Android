name: Direct CMake Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v3
      with:
        ndk-version: r21e
        add-to-path: true

    - name: Build C++ with CMake
      run: |
        cd app/src/main/cpp
        mkdir build && cd build
        cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake ..
        make -j4

    - name: Upload .so Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libMyMod.so
        path: app/src/main/cpp/build/libMyMod.so
        
