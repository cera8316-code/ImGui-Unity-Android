name: Build Android Native Library

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Native Library (.so)
      run: ./gradlew nativeLibsToRelease

    - name: Upload .so Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libMyMod.so
        path: app/build/intermediates/merged_native_libs/release/out/lib/arm64-v8a/
        
